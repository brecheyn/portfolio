<section class="experience-section" id="experience">
  <div class="container">

    <h2 class="section-title">Mon Parcours</h2>
    <p class="section-subtitle">Expériences professionnelles et formations</p>

    <div class="experience-carousel">

      <div 
        class="experience-card"
        *ngFor="let exp of experiences">

        <div class="card-header">

          <span class="company-badge" *ngIf="exp.current">
            <i class="fas fa-circle pulse"></i> En cours
          </span>

          <h3 class="position">{{ exp.position }}</h3>

          <h4 class="company">
            <i class="fas fa-building"></i> {{ exp.company }}
          </h4>

        </div>

        <div class="card-meta">
          <span class="date">
            <i class="fas fa-calendar-alt"></i>
            {{ formatDate(exp.startDate) }} -
            {{ exp.current ? 'Présent' : formatDate(exp.endDate!) }}
          </span>

          <span class="duration">
            <i class="fas fa-clock"></i>
            {{ getDuration(exp.startDate, exp.endDate) }}
          </span>
        </div>

        <p class="description">
          {{ exp.description }}
        </p>

        <div class="technologies">
          <span *ngFor="let tech of exp.technologies" class="tech-tag">
            {{ tech }}
          </span>
        </div>

      </div>

    </div>

  </div>
</section>
